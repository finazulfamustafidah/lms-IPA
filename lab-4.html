<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab 4 – Cahaya Dibiaskan</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#fff8e7;color:#333}
canvas{width:100%;max-width:720px;border-radius:12px;display:block;margin:auto}
.ctrl{max-width:720px;margin:10px auto;display:grid;gap:8px}
label{font-weight:600}input[type=range],select{width:100%;padding:6px;font-size:16px}
#msg{max-width:720px;margin:10px auto;padding:12px;border-radius:12px;font-size:18px;font-weight:700;text-align:center;background:#e4f0ff;color:#173c8a}
h3{text-align:center;margin:4px}p.t{text-align:center;margin:4px}
</style></head><body>
<h3>🥤 Lab: Cahaya Dibiaskan</h3>
<p class="t">Sinar masuk dari udara ke benda bening. Perhatikan arah sinar setelah masuk!</p>
<canvas id="c" width="720" height="380"></canvas>
<div class="ctrl">
  <label>Sudut datang: <span id="v">45</span>° <input type="range" id="a" min="0" max="80" value="45"></label>
  <label>Benda bening:
    <select id="m">
      <option value="1.33" data-c="rgba(70,150,255,.75)">Air</option>
      <option value="1.5" data-c="rgba(150,220,220,.7)">Kaca</option>
      <option value="2.42" data-c="rgba(220,240,255,.85)">Berlian</option>
    </select></label>
</div>
<div id="msg"></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const a=document.getElementById('a'),m=document.getElementById('m');
const P={x:360,y:190},L=200,D=Math.PI/180;
function line(x1,y1,x2,y2,col,w,dash){
  x.setLineDash(dash||[]);x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';
  x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.setLineDash([]);
}
function draw(){
  const i=+a.value,n=+m.value,col=m.selectedOptions[0].dataset.c;
  document.getElementById('v').textContent=i;
  const r=Math.asin(Math.sin(i*D)/n)/D;
  x.clearRect(0,0,720,380);
  x.fillStyle='#1b2440';x.fillRect(0,0,720,P.y);
  x.fillStyle=col;x.fillRect(0,P.y,720,380-P.y);
  x.fillStyle='#fff';x.font='bold 15px sans-serif';
  x.fillText('Udara',14,24);x.fillText(m.selectedOptions[0].text,14,P.y+26);
  line(P.x,P.y-L,P.x,P.y+L,'#fff',2,[6,6]); // normal
  line(P.x-L*Math.sin(i*D),P.y-L*Math.cos(i*D),P.x,P.y,'#ffd23f',6); // datang
  line(P.x,P.y,P.x+L*Math.sin(i*D),P.y+L*Math.cos(i*D),'rgba(255,255,255,.6)',3,[4,6]); // lurus (pembanding)
  line(P.x,P.y,P.x+L*Math.sin(r*D),P.y+L*Math.cos(r*D),'#ff6b6b',6); // bias
  x.fillStyle='#fff';x.fillText('Sinar datang',20,50);
  x.fillText('Sinar bias',P.x+L*Math.sin(r*D)+8,P.y+L*Math.cos(r*D)-6);
  x.fillText('Garis normal',P.x+8,24);
  document.getElementById('msg').textContent=i===0
    ?'Jika sinar tegak lurus, sinar tidak dibelokkan.'
    :'Sudut datang '+i+'°, sudut bias '+r.toFixed(0)+'°. Sinar dibelokkan MENDEKATI garis normal.';
}
a.oninput=draw;m.onchange=draw;draw();
</script></body></html>
