<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab 5 – Cahaya Diuraikan</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#fff8e7;color:#333}
canvas{width:100%;max-width:720px;background:#1b2440;border-radius:12px;display:block;margin:auto}
.ctrl{max-width:720px;margin:10px auto;display:grid;gap:8px}
label{font-weight:600}input[type=range]{width:100%}
#leg{max-width:720px;margin:8px auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#leg span{padding:4px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:14px;text-shadow:0 0 3px #000}
#msg{max-width:720px;margin:10px auto;padding:12px;border-radius:12px;font-size:18px;font-weight:700;text-align:center;background:#e4f0ff;color:#173c8a}
h3{text-align:center;margin:4px}p.t{text-align:center;margin:4px}
</style></head><body>
<h3>🌈 Lab: Cahaya Diuraikan</h3>
<p class="t">Cahaya putih melewati prisma. Putar sudutnya dan lihat warna-warna yang muncul!</p>
<canvas id="c" width="720" height="400"></canvas>
<div class="ctrl">
  <label>Sudut cahaya masuk: <span id="v">20</span>° <input type="range" id="a" min="8" max="30" value="20"></label>
</div>
<div id="leg"></div>
<div id="msg">Cahaya putih ternyata terdiri dari banyak warna (me-ji-ku-hi-bi-ni-u). Itu sebabnya pelangi bisa terbentuk!</div>
<script>
const cols=[['Merah','#ff2d2d'],['Jingga','#ff8c1a'],['Kuning','#ffe600'],['Hijau','#2ecc40'],['Biru','#2f8cff'],['Nila','#4b3bd6'],['Ungu','#a23bd6']];
document.getElementById('leg').innerHTML=cols.map(k=>`<span style="background:${k[1]}">${k[0]}</span>`).join('');
const c=document.getElementById('c'),x=c.getContext('2d');
const a=document.getElementById('a');
const M1={x:310,y:165},M2={x:410,y:165},D=Math.PI/180;
function draw(){
  const base=+a.value;
  document.getElementById('v').textContent=base;
  x.clearRect(0,0,720,400);
  // senter + sinar putih
  x.fillStyle='#ff9f1c';x.fillRect(14,140,50,44);x.fillStyle='#ffd23f';x.fillRect(60,134,12,56);
  x.strokeStyle='#fff';x.lineWidth=7;x.lineCap='round';
  x.beginPath();x.moveTo(72,162);x.lineTo(M1.x,M1.y);x.lineTo(M2.x,M2.y);x.stroke();
  // prisma
  x.beginPath();x.moveTo(360,60);x.lineTo(250,270);x.lineTo(470,270);x.closePath();
  x.fillStyle='rgba(190,230,255,.35)';x.fill();x.strokeStyle='#bfe3ff';x.lineWidth=3;x.stroke();
  // putih di dalam prisma
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=5;
  x.beginPath();x.moveTo(M1.x,M1.y);x.lineTo(M2.x,M2.y);x.stroke();
  // sinar warna
  cols.forEach((k,i)=>{
    const ang=(base+i*2.6)*D;
    x.strokeStyle=k[1];x.lineWidth=6;x.globalAlpha=.9;
    x.beginPath();x.moveTo(M2.x,M2.y);x.lineTo(M2.x+330*Math.cos(ang),M2.y+330*Math.sin(ang));x.stroke();
  });
  x.globalAlpha=1;
  x.fillStyle='#fff';x.font='bold 15px sans-serif';
  x.fillText('Cahaya putih',80,126);x.fillText('Prisma',330,290);x.fillText('Spektrum warna',520,30);
}
a.oninput=draw;draw();
</script></body></html>
