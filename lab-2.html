<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab 2 – Cahaya Menembus Benda Bening</title><link rel="stylesheet" href="lab-core.css"></head>
<body><div id="app"></div>
<script src="ai-config.js"></script><script src="lab-core.js"></script><script src="lab-icons.js"></script>
<script>
(function(){
const L=LabKit,I=L.icons;
const W=760,H=380,TB=322,FX=190,RY=225,MX=300,MW=64,MH=170,SX=650,SW=36;
const MATS={
  kaca:{n:'Kaca bening',t:.95,b:0,ov:'rgba(190,225,255,.12)',vis:'Terlihat jelas',txt:'Kaca bening meneruskan hampir semua cahaya. Layar terang dan boneka di belakangnya terlihat jelas.'},
  plastik:{n:'Plastik bening',t:.9,b:.8,ov:'rgba(200,230,255,.16)',vis:'Terlihat jelas',txt:'Plastik bening meneruskan hampir semua cahaya. Layar terang dan boneka masih terlihat jelas.'},
  air:{n:'Air jernih',t:.85,b:1.6,ov:'rgba(63,155,255,.28)',vis:'Terlihat jelas',txt:'Air jernih meneruskan cahaya. Layar terang dan boneka di belakangnya masih terlihat.'},
  minyak:{n:'Kertas minyak',t:.45,b:6,ov:'rgba(243,226,180,.8)',vis:'Terlihat buram',txt:'Kertas minyak hanya meneruskan sebagian cahaya. Layar redup dan boneka terlihat buram.'},
  kardus:{n:'Kardus',t:0,b:0,ov:'rgba(168,120,60,1)',vis:'Tidak terlihat',txt:'Kardus tidak meneruskan cahaya. Layar gelap, terbentuk bayangan, dan boneka tidak terlihat.'},
  kayu:{n:'Papan kayu',t:0,b:0,ov:'rgba(140,95,50,1)',vis:'Tidak terlihat',txt:'Papan kayu tidak meneruskan cahaya. Layar gelap, terbentuk bayangan, dan boneka tidak terlihat.'}
};
const KEYS=Object.keys(MATS);
const keyOf=t=>t>=.8?'terang':t>0?'redup':'gelap';
const lvl={terang:'Layar terang',redup:'Layar redup',gelap:'Layar gelap'};

function scene(host,o){
  const id=L.uid('s2'),inter=o.interactive;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Senter, bahan yang diuji, boneka, dan layar">
  <defs><linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13213f"/><stop offset="1" stop-color="#1f3a63"/></linearGradient>
  <linearGradient id="${id}b" x1="0" x2="1"><stop offset="0" stop-color="#fff6c2"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
  <radialGradient id="${id}g"><stop offset="0" stop-color="#fff7c4"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
  <filter id="${id}f" x="-10%" y="-300%" width="120%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="${id}k" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="${id}bl" stdDeviation="0"/></filter>
  <clipPath id="${id}cp"><rect x="441" y="13" width="298" height="114" rx="12"/></clipPath></defs>
  <rect width="${W}" height="${TB}" fill="url(#${id}w)"/>
  <path d="M0 80H760M0 160H760M0 240H760M190 0V322M380 0V322M570 0V322" stroke="#8fb4ff" stroke-opacity=".07"/>
  <rect x="440" y="12" width="300" height="116" rx="13" fill="#1d3358" stroke="#8fb4ff" stroke-opacity=".5"/>
  <g clip-path="url(#${id}cp)"><text id="${id}ted" x="590" y="100" font-size="78" text-anchor="middle" filter="url(#${id}k)" opacity="0">🧸</text><rect id="${id}ov" x="441" y="13" width="298" height="114" fill="#000" opacity="0"/></g>
  <text id="${id}q" x="590" y="96" font-size="56" text-anchor="middle" fill="#8fb4ff" opacity=".6">?</text>
  <text class="lbl" x="452" y="32">Boneka di belakang bahan:</text><text class="lbl g" id="${id}vis" x="452" y="121"> </text>
  <g transform="translate(${SX},150)">${I.screen(SW,150,22)}</g>
  <ellipse id="${id}sg" cx="${SX+SW/2}" cy="${RY}" rx="17" ry="42" fill="url(#${id}g)" opacity="0"/>
  <g id="${id}sh" opacity="0"><rect x="${MX+MW+7}" y="${RY-MH/2}" width="${SX-MX-MW-7}" height="${MH}" fill="#000" opacity=".4"/><text class="lbl" x="${(MX+MW+SX)/2}" y="${RY+4}" text-anchor="middle">bayangan</text></g>
  <g id="${id}tb">${I.table(W,TB)}</g>
  <rect x="${MX-12}" y="${RY+MH/2}" width="${MW+24}" height="${TB-RY-MH/2}" fill="#6b4222"/>
  <g id="${id}mat" transform="translate(${MX},${RY-MH/2})"></g>
  <g id="${id}bm" opacity="0"><polygon id="${id}b1" fill="url(#${id}b)"/><polygon id="${id}b1g" fill="#ffd23f" opacity=".5" filter="url(#${id}f)"/><g id="${id}b2g"><polygon id="${id}b2" fill="url(#${id}b)"/><polygon id="${id}b2l" fill="#ffd23f" opacity=".5" filter="url(#${id}f)"/></g></g>
  <rect x="${FX-90}" y="${RY+18}" width="6" height="${TB-RY-18}" fill="#6f7c92"/>
  <g transform="translate(${FX},${RY})">${I.flashlight(true)}</g>
  <text class="lbl" x="${MX+MW/2}" y="${RY-MH/2-12}" text-anchor="middle" id="${id}nm"> </text>
  <text class="lbl" x="${FX-62}" y="344" style="fill:#fff6dd">Senter</text>
  <text class="lbl" x="${SX+SW/2}" y="140" text-anchor="middle">Layar</text></svg>`+
  (inter?`<div class="ctl" id="${id}tray">${KEYS.map(k=>`<button class="chip" data-k="${k}"><svg viewBox="-4 -12 ${MW+8} ${MH+14}">${I.mat(k,MW,MH)}</svg>${MATS[k].n}</button>`).join('')}</div>`:'');
  const svg=host.querySelector('svg'),$=s=>svg.querySelector('#'+id+s);
  let st={mat:'kaca'},rev=false;
  function render(){
    const m=MATS[st.mat];
    $('mat').innerHTML=I.mat(st.mat,MW,MH);$('nm').textContent=m.n;
    const g=$('bm'),sh=$('sh'),sg=$('sg');
    if(inter)host.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===st.mat));
    if(!rev){g.setAttribute('opacity',0);sh.setAttribute('opacity',0);sg.setAttribute('opacity',0);$('ted').setAttribute('opacity',0);$('ov').setAttribute('opacity',0);$('q').setAttribute('opacity',.6);$('vis').textContent='belum diuji';return;}
    g.setAttribute('opacity',1);
    $('b1').setAttribute('points',`${FX+6},${RY-4} ${MX},${RY-4} ${MX},${RY+4} ${FX+6},${RY+4}`);
    $('b1g').setAttribute('points',`${FX+6},${RY-8} ${MX},${RY-8} ${MX},${RY+8} ${FX+6},${RY+8}`);
    const x1=MX+MW+7;
    $('b2').setAttribute('points',`${x1},${RY-4} ${SX},${RY-4} ${SX},${RY+4} ${x1},${RY+4}`);
    $('b2l').setAttribute('points',`${x1},${RY-8} ${SX},${RY-8} ${SX},${RY+8} ${x1},${RY+8}`);
    $('b2g').setAttribute('opacity',m.t>0?.3+.7*m.t:0);
    sg.setAttribute('opacity',m.t);sh.setAttribute('opacity',m.t>0?0:1);
    $('bl').setAttribute('stdDeviation',m.b);
    $('ted').setAttribute('opacity',1);$('ov').setAttribute('fill',m.ov.replace(/,[\d.]+\)$/,',1)'));$('ov').setAttribute('opacity',parseFloat(m.ov.match(/,([\d.]+)\)$/)[1]));
    $('q').setAttribute('opacity',0);$('vis').textContent=m.vis;
  }
  if(inter)host.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st.mat=c.dataset.k;render();o.onChange&&o.onChange();});
  render();
  return {
    setState(s){st={mat:s.mat};render();},getState(){return st;},
    reset(){st={mat:'kaca'};rev=false;render();},
    reveal(b){rev=b;render();},
    test(){rev=true;render();const m=MATS[st.mat],k=keyOf(m.t);return {id:st.mat,key:k,text:m.txt,cells:[m.n,lvl[k].replace('Layar ','').replace(/^./,c=>c.toUpperCase()),m.vis]};}
  };
}

const heroArt=`<svg viewBox="0 0 400 300"><defs><linearGradient id="hb2" x1="0" x2="1"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a0" stop-opacity=".25"/></linearGradient></defs>
<polygon points="110,150 220,148 220,152 110,150" fill="#ffe9a0"/><polygon points="250,146 380,120 380,180 250,154" fill="url(#hb2)"/>
<g transform="translate(220,80) scale(.65,.82)">${I.mat('kaca',64,170)}</g><text x="320" y="262" font-size="60" text-anchor="middle">🧸</text>
<g transform="translate(100,150) scale(1.1)">${I.flashlight(true)}</g></svg>`;

LabKit.create({
  key:'lab2',brand:'Misi Detektif Tembus Cahaya',kicker:'Petualangan IPA · Kelas V',title:'Misi Detektif Tembus Cahaya',
  story:'Jendela laboratorium diganti dan ruangan mendadak gelap! Selidiki bahan mana yang membiarkan cahaya lewat dan mana yang menghalanginya.',heroArt:heroArt,
  lab:{kicker:'Modul A · Eksperimen virtual',title:'Laboratorium tembus cahaya',
    desc:'Pilih satu bahan di bagian bawah. Lihat seberapa terang layar dan bagaimana boneka di belakang bahan itu terlihat. Coba semua bahan sesukamu.',
    tip:'Tip: coba semua bahan, mulai dari kaca bening sampai papan kayu.',
    predict:{q:'Prediksimu: bagaimana cahaya di layar setelah melewati bahan ini?',opts:[['terang','Layar terang'],['redup','Layar redup'],['gelap','Layar gelap']]},
    columns:['Bahan','Cahaya di layar','Boneka di belakang'],
    report:[{"q": "Ceritakan pengamatanmu pada satu bahan yang bening (kaca, plastik, atau air).", "kw": ["kaca", "plastik", "air", "bening", "terang", "jelas", "tembus", "meneruskan"], "need": 1, "model": "Memilih salah satu sudah cukup. Kaca bening, plastik bening, atau air jernih meneruskan hampir semua cahaya, sehingga layar terang dan boneka terlihat jelas."}, {"q": "Ceritakan pengamatanmu ketika memakai kertas minyak.", "kw": ["sebagian", "buram", "redup", "samar"], "need": 1, "model": "Kertas minyak hanya meneruskan sebagian cahaya: layar redup dan boneka terlihat buram."}, {"q": "Ceritakan pengamatanmu ketika memakai kardus atau papan kayu (memilih salah satu sudah cukup).", "kw": ["tidak", "terhalang", "menghalangi", "gelap", "bayangan"], "need": 1, "model": "Kardus atau papan kayu tidak meneruskan cahaya (menghalangi): layar gelap dan terbentuk bayangan."}],minObs:0},
  createScene:scene,
  missions:[
   {id:'m1',poin:["[inti] Ya, ruangan terang karena kaca bening meneruskan (membiarkan lewat) hampir semua cahaya","[pendukung] Benda di balik kaca terlihat jelas"],essay:'Apakah ruangan akan terang jika jendela dibuat dari kaca bening? Jelaskan alasannya.',title:'Detektif Kaca',short:'Mengapa jendela dibuat dari kaca?',badge:'Penjelajah Transparan',skills:['Memprediksi hasil','Menggunakan bukti'],
    story:'Jendela baru terbuat dari kaca bening. Apakah ruangan akan terang?',preset:{mat:'kaca'},
    pQ:'Prediksimu: bagaimana cahaya di layar?',pOpts:[['terang','Layar terang'],['redup','Layar redup'],['gelap','Layar gelap']],
    q:'Bukti mana yang paling tepat?',
    choices:[['Kaca bening meneruskan hampir semua cahaya, sehingga layar terang dan boneka terlihat jelas.',true],['Kaca memancarkan cahaya sendiri.',false,'Kaca tidak membuat cahaya; ia hanya meneruskan cahaya dari senter.'],['Kaca menyerap semua cahaya.',false,'Kalau menyerap semua cahaya, layar akan gelap. Padahal layar terang.'],['Kaca menghalangi cahaya sehingga terbentuk bayangan.',false,'Layar terang, jadi cahaya tidak terhalang.']],
    reasonQ:'Tulis alasanmu:',kw:['bening','tembus','menembus','diteruskan','lewat','meneruskan'],need:1,
    hints:['Lihat seberapa terang layar.','Apakah boneka di belakang kaca terlihat jelas?','Benda bening … cahaya.'],
    explain:'Benda bening meneruskan hampir semua cahaya, sehingga benda di belakangnya terlihat jelas.'},
   {id:'m2',poin:["[inti] Kertas minyak hanya meneruskan sebagian cahaya (tembus sebagian)","[pendukung] Karena itu layar redup dan boneka tampak buram/samar"],title:'Misteri Kertas Minyak',short:'Terang atau gelap?',badge:'Detektif Benda Buram',skills:['Hubungan variabel dan hasil','Memprediksi hasil'],
    story:'Kertas minyak dipasang di lubang angin. Cahaya masuk, tetapi bonekanya tampak samar.',preset:{mat:'minyak'},
    pQ:'Prediksimu: bagaimana cahaya di layar?',pOpts:[['terang','Layar terang'],['redup','Layar redup'],['gelap','Layar gelap']],
    q:'Mengapa layar redup dan boneka terlihat buram?',
    choices:[['Kertas minyak hanya meneruskan sebagian cahaya.',true],['Kertas minyak meneruskan semua cahaya.',false,'Kalau semua diteruskan, layar akan terang dan boneka jelas.'],['Kertas minyak tidak meneruskan cahaya sama sekali.',false,'Layar masih agak terang, jadi sebagian cahaya diteruskan.'],['Baterai senter hampir habis.',false,'Senter sama saja seperti pada percobaan sebelumnya.']],
    reasonQ:'Tulis alasanmu:',kw:['sebagian','buram','redup','tembus sebagian'],need:1,
    hints:['Bandingkan terang layar dengan kaca bening.','Apakah ada cahaya yang tetap sampai di layar?','Benda buram meneruskan … cahaya.'],
    explain:'Benda buram (tembus sebagian) hanya meneruskan sebagian cahaya sehingga benda di belakangnya terlihat samar.'},
   {id:'m3',poin:["[inti] Kardus tidak meneruskan cahaya (menghalangi/menahan cahaya)","[pendukung] Cahaya terhalang sehingga terbentuk bayangan dan layar gelap"],essay:'Mengapa layar menjadi gelap saat ada kardus di jalur cahaya? Jelaskan alasannya.',title:'Dinding Kardus',short:'Cahaya dihalangi kardus.',badge:'Penjelajah Benda Opaque',skills:['Hubungan variabel dan hasil','Memilih informasi relevan'],
    story:'Seseorang menaruh kardus di jalur cahaya. Layar jadi gelap.',preset:{mat:'kardus'},
    pQ:'Prediksimu: bagaimana cahaya di layar?',pOpts:[['terang','Layar terang'],['redup','Layar redup'],['gelap','Layar gelap']],
    q:'Mengapa layar gelap?',
    choices:[['Kardus tidak meneruskan cahaya sehingga cahaya terhalang dan terbentuk bayangan.',true],['Kardus memantulkan cahaya menuju layar.',false,'Layar gelap, jadi tidak ada cahaya yang sampai ke sana.'],['Kardus bening seperti kaca.',false,'Kardus tidak bening; bonekanya sama sekali tidak terlihat.'],['Cahaya berubah menjadi gelap.',false,'Cahaya tidak berubah; ia terhalang kardus.']],
    reasonQ:'Tulis alasanmu:',kw:['terhalang','menghalangi','tidak tembus','tidak diteruskan','gelap','bayangan'],need:1,
    hints:['Apakah boneka masih terlihat?','Apakah ada cahaya di belakang kardus?','Benda gelap … cahaya.'],
    explain:'Benda gelap tidak meneruskan cahaya. Cahaya terhalang dan membentuk bayangan.'},
   {id:'m4',poin:["[inti] Plastik bening meneruskan cahaya matahari sehingga tanaman tetap mendapat cahaya"],title:'Atap Rumah Kaca',short:'Mengapa tanaman memakai plastik bening?',badge:'Master Transparansi',skills:['Memilih informasi relevan','Mengidentifikasi masalah'],
    story:'Pak Tani membuat atap rumah kaca dari plastik bening agar tanaman tetap mendapat cahaya matahari.',preset:{mat:'plastik'},
    pQ:'Prediksimu: bagaimana cahaya di layar?',pOpts:[['terang','Layar terang'],['redup','Layar redup'],['gelap','Layar gelap']],
    q:'Mengapa plastik bening cocok untuk atap rumah kaca?',
    choices:[['Plastik bening meneruskan cahaya sehingga tanaman mendapat cahaya matahari.',true],['Plastik bening menghalangi semua cahaya.',false,'Layar terang, jadi cahaya diteruskan.'],['Plastik bening menghasilkan cahaya sendiri.',false,'Plastik tidak menghasilkan cahaya.'],['Plastik bening tidak dilewati cahaya tetapi hangat.',false,'Hasil ujimu menunjukkan cahaya melewati plastik.']],
    reasonQ:'Tulis alasanmu:',kw:['meneruskan','diteruskan','menembus','tembus','lewat','bening'],need:1,
    hints:['Lihat layar setelah cahaya melewati plastik.','Tanaman membutuhkan apa dari matahari?','Benda bening meneruskan cahaya.'],
    explain:'Plastik bening meneruskan cahaya matahari, sehingga tanaman di dalam rumah kaca tetap mendapat cahaya.'},
   {id:'m5',poin:["[inti] Urutan dari paling banyak meneruskan cahaya: kaca bening, lalu kertas minyak, lalu kardus","[inti] Alasan: kaca bening meneruskan hampir semua cahaya, kertas minyak sebagian, kardus tidak sama sekali"],essay:'Urutkan kaca bening, kertas minyak, dan kardus dari yang paling banyak meneruskan cahaya. Jelaskan alasan urutanmu.',title:'Selamatkan Laboratorium',short:'Urutkan bahan dari yang paling menembus.',badge:'Juara Laboratorium',skills:['Menggunakan bukti','Memilih informasi relevan','Memprediksi hasil'],
    story:'Kamu sudah menguji kaca, kertas minyak, dan kardus. Susun hasilnya dari yang paling banyak meneruskan cahaya.',preset:{mat:'air'},
    pQ:'Prediksimu: bagaimana cahaya di layar melewati air jernih?',pOpts:[['terang','Layar terang'],['redup','Layar redup'],['gelap','Layar gelap']],
    q:'Urutan mana yang benar (dari paling banyak meneruskan cahaya)?',
    choices:[['Kaca bening → kertas minyak → kardus',true],['Kardus → kertas minyak → kaca bening',false,'Urutannya terbalik. Kardus tidak meneruskan cahaya sama sekali.'],['Kertas minyak → kaca bening → kardus',false,'Kaca bening meneruskan lebih banyak cahaya daripada kertas minyak.'],['Kaca bening → kardus → kertas minyak',false,'Kertas minyak masih meneruskan sebagian cahaya, kardus tidak.']],
    reasonQ:'Jelaskan singkat urutan itu:',kw:['bening','sebagian','tidak','meneruskan','menghalangi'],need:2,
    hints:['Ingat hasil layar tiap bahan.','Mana yang layarnya paling terang? Mana yang gelap?','Bening → sebagian → tidak sama sekali.'],
    explain:'Benda bening meneruskan paling banyak cahaya, benda buram hanya sebagian, dan benda gelap tidak meneruskan cahaya.'}
  ]
});
})();
</script></body></html>
